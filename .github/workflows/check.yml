name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
      - run: find config public src tools tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/run.php
      - run: node --check public/assets/chat.js
